<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>معرض الأعمال</title>
<meta name="description" content="تصاميم سوشيال ميديا وموشن جرافيك">
<meta property="og:title" content="معرض الأعمال">
<meta property="og:description" content="تصاميم سوشيال ميديا وموشن جرافيك">
<meta property="og:type" content="website">
<meta property="og:url" content="https://heshamkmt.github.io/Instagram-Mockup/">
<meta property="og:image" content="https://heshamkmt.github.io/Instagram-Mockup/images/23ea7028ea9a.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
:root{--bg:#FFFFFF;--surface:#F4F6F8;--line:#DDE2E8;--fg:#0E1726;--muted:#5E6B7D;--accent:#0B6BCB;--font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0B0F16;--surface:#161C26;--line:#273142;--fg:#EEF2F7;--muted:#97A3B6;--accent:#4C9EEB;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:935px;margin:0 auto;padding-block:max(28px,env(safe-area-inset-top)) max(56px,env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right));display:flex;flex-direction:column;gap:22px}
.profile{display:flex;align-items:center;gap:24px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.avatar{width:86px;height:86px;border-radius:50%;flex:none;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:30px;font-weight:700;color:var(--muted)}
.pinfo{display:flex;flex-direction:column;gap:8px;min-width:0}
h1{font-size:22px;margin:0}
.stats{font-size:15px}.stats b{font-variant-numeric:tabular-nums}
.bio{margin:0;color:var(--muted);font-size:15px;line-height:1.6}
.bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:7px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tile{all:unset;display:block;position:relative;aspect-ratio:var(--ratio,4/5);background:var(--surface);overflow:hidden;cursor:zoom-in}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
.tile:hover img{opacity:.88}
.tile:focus-visible,.seg button:focus-visible,.lb button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.lb img{max-width:100%;max-height:calc(100% - 64px);object-fit:contain;border-radius:6px}
.lb .nav{display:flex;gap:10px;align-items:center;color:#fff;font-size:14px;font-variant-numeric:tabular-nums}
.lb button{font:inherit;color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:6px 16px;cursor:pointer}
@media (max-width:520px){.profile{gap:16px}.avatar{width:68px;height:68px;font-size:24px}h1{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="wrap">
    <header class="profile">
      <div class="avatar" aria-hidden="true">م</div>
      <div class="pinfo">
        <h1>معرض الأعمال</h1>
        <div class="stats"><b>30</b> منشور</div>
        <p class="bio">تصاميم سوشيال ميديا وموشن جرافيك</p>
      </div>
    </header>
    <div class="bar">
      <span>مقاس الشبكة</span>
      <div class="seg" id="ratioSeg" role="group" aria-label="مقاس المربعات">
        <button type="button" data-r="4/5">4:5</button>
        <button type="button" data-r="3/4">3:4</button>
        <button type="button" data-r="1/1">1:1</button>
      </div>
    </div>
    <div class="grid" id="grid">
      <button class="tile" type="button" data-i="0" aria-label="منشور 1"><img src="images/23ea7028ea9a.jpg" width="1080" height="1920" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="1" aria-label="منشور 2"><img src="images/9f1a15b65b30.jpg" width="1080" height="1350" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="2" aria-label="منشور 3"><img src="images/7221174c4c34.jpg" width="1080" height="1920" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="3" aria-label="منشور 4"><img src="images/adac82e5912b.jpg" width="1080" height="1350" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="4" aria-label="منشور 5"><img src="images/bb95f598bea5.jpg" width="1080" height="1920" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="5" aria-label="منشور 6"><img src="images/590d64fed46f.jpg" width="1080" height="1350" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="6" aria-label="منشور 7"><img src="images/aaf89d710cdd.jpg" width="1080" height="1920" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="7" aria-label="منشور 8"><img src="images/bb0f9f44dea3.jpg" width="1080" height="1350" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="8" aria-label="منشور 9"><img src="images/62f21973911b.jpg" width="1080" height="1920" alt="" loading="eager" decoding="async"></button>
      <button class="tile" type="button" data-i="9" aria-label="منشور 10"><img src="images/992a175132d3.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="10" aria-label="منشور 11"><img src="images/a53d6d485da9.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="11" aria-label="منشور 12"><img src="images/d653484971e0.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="12" aria-label="منشور 13"><img src="images/09597336a27c.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="13" aria-label="منشور 14"><img src="images/a282f380fb09.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="14" aria-label="منشور 15"><img src="images/00e346b1245b.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="15" aria-label="منشور 16"><img src="images/7312238bbdfe.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="16" aria-label="منشور 17"><img src="images/26b0ecaa94ae.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="17" aria-label="منشور 18"><img src="images/a29c41c678b0.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="18" aria-label="منشور 19"><img src="images/69a0637759eb.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="19" aria-label="منشور 20"><img src="images/645a229ee2af.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="20" aria-label="منشور 21"><img src="images/9c031d4a1076.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="21" aria-label="منشور 22"><img src="images/c41845c49d08.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="22" aria-label="منشور 23"><img src="images/b90fe0387885.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="23" aria-label="منشور 24"><img src="images/96eb112c31f9.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="24" aria-label="منشور 25"><img src="images/ed41d6c47efe.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="25" aria-label="منشور 26"><img src="images/81846a5c0b9e.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="26" aria-label="منشور 27"><img src="images/ac3a2e7504c0.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="27" aria-label="منشور 28"><img src="images/870e2c4c7747.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="28" aria-label="منشور 29"><img src="images/c5211a13f695.jpg" width="1080" height="1920" alt="" loading="lazy" decoding="async"></button>
      <button class="tile" type="button" data-i="29" aria-label="منشور 30"><img src="images/51fd561c08af.jpg" width="1080" height="1350" alt="" loading="lazy" decoding="async"></button>
    </div>
  </main>
  <div class="lb" id="lb" hidden>
    <img id="lbImg" alt="">
    <div class="nav"><button type="button" id="lbPrev">السابق</button><span id="lbPos"></span><button type="button" id="lbNext">التالي</button><button type="button" id="lbClose">إغلاق</button></div>
  </div>
<script>
(function(){
  var grid=document.getElementById('grid'), tiles=[].slice.call(grid.querySelectorAll('.tile'));
  var srcs=tiles.map(function(t){return t.querySelector('img').getAttribute('src')});
  function setRatio(r){grid.style.setProperty('--ratio',r);[].forEach.call(document.querySelectorAll('#ratioSeg button'),function(b){b.setAttribute('aria-pressed',String(b.dataset.r===r))});}
  setRatio('4/5');
  [].forEach.call(document.querySelectorAll('#ratioSeg button'),function(b){b.onclick=function(){setRatio(b.dataset.r)}});
  var lb=document.getElementById('lb'), img=document.getElementById('lbImg'), pos=document.getElementById('lbPos'), cur=0, last=null;
  function open(i){cur=(i+srcs.length)%srcs.length; img.src=srcs[cur]; pos.textContent=(cur+1)+' / '+srcs.length; if(lb.hidden){last=document.activeElement; lb.hidden=false; document.getElementById('lbClose').focus();}}
  function close(){lb.hidden=true; if(last) last.focus();}
  tiles.forEach(function(t,i){t.onclick=function(){open(i)}});
  document.getElementById('lbNext').onclick=function(){open(cur+1)};
  document.getElementById('lbPrev').onclick=function(){open(cur-1)};
  document.getElementById('lbClose').onclick=close;
  lb.addEventListener('click',function(e){if(e.target===lb)close()});
  document.addEventListener('keydown',function(e){if(lb.hidden)return; if(e.key==='Escape')close(); if(e.key==='ArrowLeft')open(cur+1); if(e.key==='ArrowRight')open(cur-1);});
  var x0=null; lb.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
  lb.addEventListener('touchend',function(e){if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>50) open(cur+(dx>0?1:-1)); x0=null;});
})();
</script>
</body>
</html>
